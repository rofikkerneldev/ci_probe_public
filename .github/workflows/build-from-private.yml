name: Build timelm ARM64 driver from the private source
# The private repository holds the source of truth. This public repository is
# only a runner seed: it clones the private branch, builds the ARM64 driver,
# runs the native touch lifecycle tests and uploads the artefacts.
#
# Why a public seed: the private repository cannot start a job on this
# account because the account spending limit is exhausted, and a private
# repository also gets the smaller 2 core runner. A public repository is not
# billed against that limit and receives the 4 core runner, so the same
# private source is still built by the full size runner.
on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: Private repository that holds the source of truth
        required: false
        default: rofikkerneldev/test_mu-timelm
      source_ref:
        description: Branch or commit to build
        required: false
        default: codex/timelm-sw42902-bringup
  push:
    paths:
      - '.github/workflows/build-from-private.yml'
permissions:
  contents: read
jobs:
  arm64-driver:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out the private source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repository || 'rofikkerneldev/test_mu-timelm' }}
          ref: ${{ inputs.source_ref || 'codex/timelm-sw42902-bringup' }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: source
      - name: Report the built commit
        shell: pwsh
        working-directory: source
        run: |
          $sha = (git rev-parse HEAD).Trim()
          if ($sha -notmatch '^[0-9a-f]{40}$') { throw "The commit pin is not a full 40 character hash: $sha" }
          "Built commit: $sha"
          "Built commit: $sha" | Out-File -FilePath ../commit-pin.txt -Encoding ascii
      - name: Build the ARM64 GENI I2C driver
        shell: pwsh
        working-directory: source
        run: ./Resources/Scripts/build_geni_i2c.ps1
      - name: Build the native touch host and client
        shell: pwsh
        working-directory: source
        run: ./Resources/Scripts/build_sw42902_touch.ps1
      - name: Validate the GPIO trial helpers without touching hardware
        shell: powershell
        working-directory: source
        run: ./Resources/Scripts/TouchGpio/Test-TouchGpioGuards.ps1
      - name: Upload the ARM64 driver package
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timelm-GENI-I2C-ARM64-from-private
          path: |
            source/GPLDrivers/Windows/KonaGeniI2c/out/
            source/GPLDrivers/Windows/Sw42902Touch/driver/kmdf/out/
            commit-pin.txt
          if-no-files-found: warn
          retention-days: 14
  linux-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the private source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repository || 'rofikkerneldev/test_mu-timelm' }}
          ref: ${{ inputs.source_ref || 'codex/timelm-sw42902-bringup' }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          path: source
      - name: Report the tested commit
        shell: bash
        working-directory: source
        run: |
          set -eu
          sha=$(git rev-parse HEAD)
          case "$sha" in
            [0-9a-f]*) [ ${#sha} -eq 40 ] || { echo "The commit pin is not a full 40 character hash: $sha"; exit 1; } ;;
            *) echo "The commit pin is not a 40 character hash: $sha"; exit 1 ;;
          esac
          echo "Tested commit: $sha"
          gcc --version | head -1
          python3 --version
      - name: Decompile the bundled DSDT for pin-map review
        working-directory: source
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq acpica-tools
          iasl -d Resources/DeviceOverlays/timelm/ACPI/DSDT.aml
          mkdir -p dsdt-review
          cp Resources/DeviceOverlays/timelm/ACPI/DSDT.dsl dsdt-review/DSDT.dsl
          cp Resources/DeviceOverlays/timelm/ACPI/DSDT.aml dsdt-review/DSDT.aml
          sha256sum dsdt-review/DSDT.aml | tee dsdt-review/sha256.txt
      - name: Upload the DSDT review copy
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timelm-DSDT-decompiled
          path: source/dsdt-review/
          if-no-files-found: warn
          retention-days: 14
      - name: Run the native touch lifecycle tests
        shell: bash
        working-directory: source
        run: |
          set -eux
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g \
            GPLDrivers/Windows/KonaGeniI2c/tests/board_test.c \
            GPLDrivers/Windows/KonaGeniI2c/touch_clock.c \
            GPLDrivers/Windows/KonaGeniI2c/touch_board.c -o /tmp/touch-board-test
          /tmp/touch-board-test
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g \
            GPLDrivers/Windows/KonaGeniI2c/tests/fifo_test.c \
            GPLDrivers/Windows/KonaGeniI2c/geni_fifo.c -o /tmp/touch-fifo-test
          /tmp/touch-fifo-test
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g \
            GPLDrivers/Windows/KonaGeniI2c/tests/gpi_test.c \
            GPLDrivers/Windows/KonaGeniI2c/geni_gpi.c -o /tmp/touch-gpi-test
          /tmp/touch-gpi-test
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g \
            -IGPLDrivers/Windows/KonaGeniI2c/tests/iommu_shim \
            GPLDrivers/Windows/KonaGeniI2c/tests/iommu_test.c \
            GPLDrivers/Windows/KonaGeniI2c/iommu_windows.c -o /tmp/touch-iommu-test
          /tmp/touch-iommu-test
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g \
            GPLDrivers/Windows/KonaGeniI2c/tests/probe_policy_test.c -o /tmp/touch-probe-policy-test
          /tmp/touch-probe-policy-test
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g \
            -IGPLDrivers/Windows/KonaGeniI2c/tests/probe_shim \
            GPLDrivers/Windows/KonaGeniI2c/tests/probe_windows_test.c -o /tmp/touch-probe-windows-test
          /tmp/touch-probe-windows-test
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g \
            GPLDrivers/Windows/KonaGeniI2c/tests/bitbang_test.c \
            GPLDrivers/Windows/KonaGeniI2c/bitbang_i2c.c -o /tmp/touch-bitbang-test
          /tmp/touch-bitbang-test
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g \
            -IGPLDrivers/Windows/KonaGeniI2c/tests/bitbang_shim \
            GPLDrivers/Windows/KonaGeniI2c/tests/bitbang_windows_test.c -o /tmp/touch-bitbang-windows-test
          /tmp/touch-bitbang-windows-test
          python3 Resources/DeviceOverlays/timelm/Drivers/KonaGPIO/test_touch_bus.py
          python3 Resources/Scripts/tests/test_timelm_touch_iort.py
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g \
            GPLDrivers/Windows/Sw42902Touch/tests/protocol_test.c -o /tmp/touch-protocol-test
          /tmp/touch-protocol-test
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g \
            GPLDrivers/Windows/Sw42902Touch/tests/init_test.c -o /tmp/touch-init-test
          /tmp/touch-init-test
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g \
            GPLDrivers/Windows/Sw42902Touch/tests/basic_test.c \
            GPLDrivers/Windows/Sw42902Touch/driver/sw42902_basic.c -o /tmp/touch-basic-test
          /tmp/touch-basic-test
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g \
            Platforms/LG/timelmPkg/Applications/TouchDmaCheck/snapshot_test.c -o /tmp/touch-dma-check-test
          /tmp/touch-dma-check-test
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -g \
            Resources/DeviceOverlays/timelm/Drivers/KonaSPMI/tests/transaction_test.c -o /tmp/spmi-transaction-test
          /tmp/spmi-transaction-test
      - name: Compile the pin-registry DSDT from the ASL source
        working-directory: source
        run: |
          set -eu
          sudo apt-get install -y -qq acpica-tools
          mkdir -p Build/TouchGpio
          iasl -ve -p Build/TouchGpio/DSDT Resources/DeviceOverlays/timelm/ACPI/DSDT.asl
          # Runner-local sync: the trial generator still reads the committed AML,
          # so the freshly compiled registry DSDT replaces it here and its hash is
          # stamped into the manifest before the one-shot image is generated. The
          # committed AML itself follows in a separate source commit.
          cp Build/TouchGpio/DSDT.aml Resources/DeviceOverlays/timelm/ACPI/DSDT.aml
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          overlay = Path('Resources/DeviceOverlays/timelm')
          digest = hashlib.sha256((overlay / 'ACPI/DSDT.aml').read_bytes()).hexdigest()
          manifest = json.loads((overlay / 'SHA256.json').read_text())
          manifest['ACPI/DSDT.aml'] = digest
          (overlay / 'SHA256.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
      - name: Build the one-boot GPIO trial image
        working-directory: source
        run: |
          set -eu
          sudo apt-get install -y -qq clang lld
          git submodule update --init --depth 1 Mu_Basecore
          ./Resources/Scripts/build_touch_gpio_trial.sh
      - name: Upload the GPIO trial artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timelm-TouchGpio-trial
          path: source/Build/TouchGpio/
          if-no-files-found: warn
          retention-days: 14
